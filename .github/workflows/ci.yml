name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r cnc/requirements.txt
          pip install pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check cnc || true   # advisory until the backlog is cleared
      - name: Tests
        run: pytest -q
